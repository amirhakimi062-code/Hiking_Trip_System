<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Masuk - Merendang Hikers</title>
    <link rel="stylesheet" href="../css/LoginPage.css">

</head>
<body>

    <div class="login-container">
    <div class="brand-section">
        <img src="../logo.jpg" alt="Logo Merendang Hikers" onerror="this.src='https://placehold.co/80x80?text=MH'">
        <h1>MERENDANG <span>HIKERS</span></h1>
        <p>ELevating Journeys, Beyond Summits</p>
    </div>

    <div class="tab-menu" id="loginTabs">
        <button class="tab-btn active" onclick="tukarTab('customer')"><i class="fa-solid fa-user"></i> Customer</button>
        <button class="tab-btn" onclick="tukarTab('staff')"><i class="fa-solid fa-user-shield"></i> Staff / Guide</button>
    </div>

    <div class="form-content">

        <div id="panel-customer" class="form-panel active">
            <form onsubmit="prosesCustomerLogin(event)">
                <div class="form-group">
                    <label>Email:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="custEmail" placeholder="........@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <div class="input-wrapper password-container">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="custPass" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye toggle-password-btn"
                        onclick="togglePasswordVisibility('custPass', this)">
                        </i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">LOG IN</button>
                <div class="toggle-link">
                    DON'T HAVE AN ACCOUNT YET? <a href="#" onclick="tukarKeRegister(true)">Create new account</a>
                </div>
            </form>
        </div>

        <div id="panel-register" class="form-panel">
            <h3 style="color: var(--primary-color); margin-bottom: 15px; font-size: 1.1rem;">Register a New Hikers</h3>
            <form onsubmit="prosesCustomerRegister(event)">
                <div class="form-group">
                    <label>Full Name:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="regName" placeholder="Full name as in the ID card." required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="regEmail" placeholder=".......@email.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-phone"></i>
                        <input type="tel" id="regPhone" placeholder="eg: 012-3456789" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>New Password:</label>
                    <div class="input-wrapper password-container">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="regPass" placeholder="Minimum 6 character" required>
                        <i class="fa-solid fa-eye toggle-password-btn"
                        onclick="togglePasswordVisibility('regPass', this)">
                        </i>
                    </div>
                </div>
                <button type="submit" class="submit-btn" style="background-color: var(--secondary-color);">Register & Save Account</button>
                <div class="toggle-link">
                    Already registered? <a href="#" onclick="tukarKeRegister(false)">Return to Login Page</a>
                </div>
            </form>
        </div>

        <div id="panel-staff" class="form-panel">
            <div class="note-info">
                <i class="fa-solid fa-circle-info"></i> Please enter your official <b>STAFF ID</b> or <b>GUIDE ID</b> .
            </div>
            <form onsubmit="prosesStaffGuideLogin(event)">
                <div class="form-group">
                    <label>ID Staff / ID Guide:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-id-badge"></i>
                        <input type="text" id="staffGuideId" placeholder="S001 atau G001" required style="text-transform: uppercase;">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password:</label>
                    <div class="input-wrapper password-container">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="staffPass" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye toggle-password-btn"
                        onclick="togglePasswordVisibility('staffPass', this)">
                        </i>
                    </div>
                </div>
                <button type="submit" class="submit-btn">LOG IN</button>
            </form>
        </div>

    </div>
</div>

<script src="../script/login.js"></script>
</body>
